<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Zaori — MetaMask Sepolia Demo</title>

  <style>
    /* ======== RESET ======== */
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      background: linear-gradient(135deg, #0a0a0f 0%, #13161c 100%);
      color: #f0f4ff;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }

    /* ======== CONTAINER ======== */
    .app {
      width: 100%;
      max-width: 780px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(12px);
    }

    h1 {
      text-align: center;
      font-weight: 700;
      font-size: 1.8rem;
      margin-bottom: 24px;
      color: #8b9eff;
      letter-spacing: 0.5px;
    }

    h3 {
      margin-top: 32px;
      margin-bottom: 8px;
      color: #b3c2ff;
    }

    button {
      background: linear-gradient(90deg, #3b82f6, #6366f1);
      border: none;
      color: white;
      font-weight: 600;
      padding: 10px 18px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    button:hover {
      background: linear-gradient(90deg, #2563eb, #4f46e5);
      transform: scale(1.03);
    }

    input {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      color: #f0f4ff;
      padding: 10px;
      width: 100%;
    }

    label {
      font-size: 0.9rem;
      color: #9ca3af;
      display: block;
      margin-top: 10px;
    }

    .row {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .status {
      margin-top: 12px;
      padding: 14px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    pre {
      background: #0b1220;
      color: #dfefff;
      padding: 14px;
      border-radius: 10px;
      overflow: auto;
      font-size: 0.85rem;
      line-height: 1.4;
      margin-top: 12px;
    }

    hr {
      border: none;
      height: 1px;
      background: rgba(255, 255, 255, 0.1);
      margin: 32px 0;
    }

    #balance, #balanceEur, #balanceUsd {
      font-weight: 600;
      color: #ffffff;
    }

    #balanceEur {
      color: #93c5fd;
      margin-left: 6px;
    }

    #balanceUsd {
      color: #f9a8d4;
      margin-left: 6px;
    }

    small.muted {
      color: #9ca3af;
      display: block;
      margin-top: 6px;
    }

    a {
      color: #60a5fa;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }

    .tx-box {
      background: rgba(99, 102, 241, 0.08);
      border: 1px solid rgba(99, 102, 241, 0.2);
      border-radius: 10px;
      padding: 16px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>💠 Zaori — MetaMask Sepolia Demo</h1>

    <div>
      <button id="btnConnect">Conectar MetaMask</button>
      <span id="account">Não conectado</span>
    </div>

    <div style="margin-top:12px;">
      <strong>Rede atual:</strong> <span id="network">—</span>
      <button id="btnEnsureSepolia">Garantir Sepolia</button>
    </div>

    <hr />

    <h3>Consultar saldo</h3>
    <div class="row">
      <input id="addressToCheck" placeholder="Endereço (ou deixe em branco para conta conectada)" />
      <button id="btnGetBalance">Consultar</button>
    </div>
    <div class="status">
      <strong>Saldo:</strong>
      <span id="balance">—</span>
      <span id="balanceEur">(≈ — EUR)</span>
      <span id="balanceUsd">(≈ — USD)</span>
      <small class="muted">Conversão baseada no preço real do ETH (mainnet). Tokens de teste não têm valor real.</small>
    </div>

    <hr />

    <h3>Enviar transação</h3>
    <div class="tx-box">
      <label>Para (endereço):</label>
      <input id="txTo" placeholder="0x..." />
      <label>Valor (ETH):</label>
      <input id="txValue" placeholder="ex.: 0.01" />
      <button id="btnSendTx" style="margin-top:8px;">Enviar Transação</button>
    </div>

    <div class="status" id="txStatus">
      <strong>Status TX:</strong>
      <div id="txInfo">Nenhuma transação ainda</div>
    </div>

    <hr />
    <h4>Logs</h4>
    <pre id="log">Pronto.</pre>
  </div>

  <!-- ethers v6 via ESM -->
  <script type="module">
    import { BrowserProvider, formatEther, parseEther, isAddress }
      from "https://esm.sh/ethers@6";
    window.E6 = { BrowserProvider, formatEther, parseEther, isAddress };
  </script>

  <!-- app principal -->
  <script type="module" src="./app.js"></script>
</body>
</html>
